[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name         tail
    Path         /var/log/lendstack/*.log
    Parser       json
    Tag          lendstack.*
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On

[OUTPUT]
    Name   file
    Match  *
    File   /var/log/fluent/out
    Format plain

