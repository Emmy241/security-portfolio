name: lendstack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      RO_DB_PASSWORD: ${RO_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lendstack-net]

  api:
    image: lendstack-api-test:latest
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOG_DIR: /var/log/lendstack
    volumes:
      - api-logs:/var/log/lendstack
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [lendstack-net]

  fluent-bit:
    image: fluent/fluent-bit:3.1
    user: root
    volumes:
      - ./infra/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - api-logs:/var/log/lendstack:ro
      - fluent-out:/var/log/fluent
    depends_on: [api]
    networks: [lendstack-net]

  mock-llm:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    networks: [lendstack-net]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks: [lendstack-net]

volumes:
  pgdata:
  api-logs:
  fluent-out:

networks:
  lendstack-net:
    driver: bridge
